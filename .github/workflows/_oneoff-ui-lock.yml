name: oneoff-frontend-lock
# One-time branch-only lock generation; remove this write-enabled workflow afterward.
on:
  push:
    branches: [feat/interactive-dashboard-ui]
    paths: [.github/workflows/_oneoff-ui-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the approved React Vite dependencies
        run: npm install --no-audit --no-fund --package-lock-only
      - name: Prove pinned dependency build is reproducible
        run: |
          npm ci --no-audit --no-fund
          npm run ui:check
          npm run ui:test
          npm run ui:build
          npm run typecheck
          npm test
      - name: Commit only verified generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(ui): lock verified React and Vite dependencies"
            git push origin HEAD:feat/interactive-dashboard-ui
          fi
