name: financial-timeline-local-d1-browser
# One-shot verification for C2. No deploy, no remote D1, no long-lived secrets.
on:
  push:
    branches: [feat/financial-timeline-alerts]
    paths: [.github/workflows/financial-timeline-local-d1-browser.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cashcontrol-c2-local
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile and test frontend and financial backend
        run: |
          npm run ui:check
          npm run ui:test
          npm run ui:build
          npm run typecheck
          npm test
          node --check web/tests/browser-e2e.mjs
      - name: Install Chromium headless shell
        run: npx playwright install --only-shell chromium
      - name: Prepare disposable local D1 and Better Auth
        shell: bash
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i 's/REPLACE_WITH_REAL_D1_ID/00000000-0000-0000-0000-000000000001/' wrangler.toml
          echo 'BETTER_AUTH_URL=http://127.0.0.1:8787' > .dev.vars
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> .dev.vars
          echo 'ALLOW_SIGN_UP=true' >> .dev.vars
      - name: Apply migrations 0001 through 0006 on local D1
        run: npx wrangler d1 migrations apply DB --local --config wrangler.toml
      - name: Launch local Workerd and production-preview UI
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --config wrangler.toml > /tmp/c2-worker.log 2>&1 &
          echo $! > /tmp/c2-worker.pid
          npm run ui:preview > /tmp/c2-frontend.log 2>&1 &
          echo $! > /tmp/c2-frontend.pid
      - name: Real authenticated C2 browser journey and regressions
        run: npm run ui:e2e
      - name: Stop services and clear temporary auth environment
        if: always()
        shell: bash
        run: |
          for file in /tmp/c2-worker.pid /tmp/c2-frontend.pid; do
            if [ -f "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
          rm -f .dev.vars
      - name: No remote resource used
        if: always()
        run: echo 'LOCAL_ONLY; NO_REMOTE_D1; NO_DEPLOY; WORKERS_CPU_NOT_MEASURED'
