name: g1-loans-local-review
on:
  push:
    branches: [feat/g1-personal-loan-receivables]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g1-loans-local-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and regression suites
        run: |
          npm run typecheck
          npm run ui:check
          npm run ui:build
          npm test
          npm run ui:test
      - name: Prepare temporary local D1
        shell: bash
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i 's/REPLACE_WITH_REAL_D1_ID/00000000-0000-0000-0000-000000000001/' wrangler.toml
          echo 'BETTER_AUTH_URL=http://127.0.0.1:8787' > .dev.vars
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> .dev.vars
          echo 'ALLOW_SIGN_UP=true' >> .dev.vars
      - name: Apply versioned migrations through G1
        run: npx wrangler d1 migrations apply DB --local --config wrangler.toml
      - name: Prepare Chromium
        run: npx playwright install --only-shell chromium
      - name: Launch local Worker and Vite preview
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --config wrangler.toml >/tmp/g1-worker.log 2>&1 &
          echo $! >/tmp/g1-worker.pid
          npm run ui:preview >/tmp/g1-web.log 2>&1 &
          echo $! >/tmp/g1-web.pid
      - name: Authenticated G1 browser verification
        run: npm run g1:e2e
      - name: Cleanup local resources
        if: always()
        shell: bash
        run: |
          for f in /tmp/g1-worker.pid /tmp/g1-web.pid; do
            if [ -f "$f" ]; then kill "$(cat "$f")" 2>/dev/null || true; fi
          done
          rm -f .dev.vars
      - name: No deployment and no real user data
        if: always()
        run: echo 'NO_DEPLOY NO_REMOTE_D1 NO_REAL_USER_DATA'
