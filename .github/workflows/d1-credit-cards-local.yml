name: d1-credit-cards-and-invoices-local-review
on:
  push:
    branches: [feat/d1-credit-cards-installments]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-credit-cards-local
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, builds and deterministic regressions
        run: |
          npm run typecheck
          npm run ui:check
          npm run ui:build
          npm test
          npm run ui:test
          node --check web/tests/cards-browser-e2e.mjs
      - name: Prepare Chromium
        run: npx playwright install --only-shell chromium
      - name: Configure disposable local D1
        shell: bash
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i 's/REPLACE_WITH_REAL_D1_ID/00000000-0000-0000-0000-000000000001/' wrangler.toml
          echo 'BETTER_AUTH_URL=http://127.0.0.1:8787' > .dev.vars
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> .dev.vars
          echo 'ALLOW_SIGN_UP=true' >> .dev.vars
      - name: Apply all migrations including D1 0007
        run: npx wrangler d1 migrations apply DB --local --config wrangler.toml
      - name: Run disposable Worker and production UI
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --config wrangler.toml > /tmp/d1-worker.log 2>&1 &
          echo $! > /tmp/d1-worker.pid
          npm run ui:preview > /tmp/d1-web.log 2>&1 &
          echo $! > /tmp/d1-web.pid
      - name: Real Chromium cards, purchases, invoices, and A/B auth
        run: npm run d1:e2e
      - name: Dispose local processes and secrets
        if: always()
        shell: bash
        run: |
          for pid in /tmp/d1-worker.pid /tmp/d1-web.pid; do
            if [ -f "$pid" ]; then kill "$(cat "$pid")" 2>/dev/null || true; fi
          done
          rm -f .dev.vars
      - name: No remote deployment
        if: always()
        run: echo 'NO_DEPLOY NO_REMOTE_D1 NO_REAL_USER_DATA'
