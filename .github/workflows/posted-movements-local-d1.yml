name: posted-movements-local-d1
# Disposable local integration only; no deployment, no remote Cloudflare account.
on:
  push:
    branches: [feat/posted-income-expense]
    paths: [.github/workflows/posted-movements-local-d1.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cashcontrol-posted-movements
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: SQLite domain and authorization regression
        run: npm test
      - name: Prepare ephemeral local D1 and secret
        shell: bash
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i 's/REPLACE_WITH_REAL_D1_ID/00000000-0000-0000-0000-000000000001/' wrangler.toml
          echo 'BETTER_AUTH_URL=http://127.0.0.1:8787' > .dev.vars
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> .dev.vars
          echo 'ALLOW_SIGN_UP=true' >> .dev.vars
      - name: Apply D1 migrations 0001-0003
        run: npx wrangler d1 migrations apply DB --local --config wrangler.toml
      - name: Boot real Better Auth / Hono Worker with local D1
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --config wrangler.toml > /tmp/cashcontrol-movements-worker.log 2>&1 &
          echo $! > /tmp/cashcontrol-movements-worker.pid
      - name: Login two users and exercise income/expense authorization
        run: node scripts/e2e-auth.mjs
      - name: Stop disposable Worker
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cashcontrol-movements-worker.pid ]; then kill "$(cat /tmp/cashcontrol-movements-worker.pid)" 2>/dev/null || true; fi
      - name: State CPU measurement boundary
        if: always()
        run: echo "WORKERS_FREE_CPU_NOT_MEASURED; this run uses local D1 and does not deploy."
